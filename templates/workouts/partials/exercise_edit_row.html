<!-- Inline Exercise Editor Row (HTMX Swap — Single-Layer Inset Panel) -->
<div id="exercise-row-{{ workout_exercise.id }}"
    class="card-theme !border-[var(--border-active)] overflow-hidden">

    <form method="post" action="{% url 'workouts:workout_exercise_edit' workout.id workout_exercise.id %}"
        hx-post="{% url 'workouts:workout_exercise_edit' workout.id workout_exercise.id %}"
        hx-target="#workout-exercise-list"
        class="divide-y divide-[var(--border-subtle)]"
        x-data="{
            sets: {{ workout_exercise.target_sets }},
            reps: {{ workout_exercise.target_reps }},
            weight: {% if workout_exercise.target_weight_kg %}{{ workout_exercise.target_weight_kg }}{% else %}null{% endif %}
        }">
        {% csrf_token %}
        <input type="hidden" name="exercise" value="{{ workout_exercise.exercise.id }}">

        <!-- Header Row -->
        <div class="p-3.5 flex items-center justify-between gap-2 bg-[var(--bg-surface-elevated)]">
            <div class="flex items-center gap-2 flex-wrap">
                <span class="text-xs font-semibold text-accent">Editing</span>
                <span class="font-semibold text-sm text-[var(--text-primary)]">{{ workout_exercise.exercise.name }}</span>
                <span class="text-[10px] px-2 py-0.5 rounded-md badge-neutral">
                    {{ workout_exercise.exercise.muscle_group }}
                </span>
            </div>
        </div>

        <!-- Sets Row -->
        <div class="flex items-center justify-between gap-3 p-3.5">
            <div>
                <label class="block text-xs font-semibold text-[var(--text-primary)]">Sets</label>
                <span class="text-[11px] text-[var(--text-muted)]">Working sets</span>
            </div>
            <div class="flex items-center gap-1.5 shrink-0">
                <button type="button" @click="if (sets > 1) sets--" class="counter-btn">-</button>
                <input type="number" name="target_sets" x-model.number="sets" min="1" max="30"
                    class="input-gym !w-20 text-center font-semibold text-base !h-11 !py-1 !px-2">
                <button type="button" @click="if (sets < 30) sets++" class="counter-btn">+</button>
            </div>
        </div>

        <!-- Reps Row -->
        <div class="flex items-center justify-between gap-3 p-3.5">
            <div>
                <label class="block text-xs font-semibold text-[var(--text-primary)]">Reps</label>
                <span class="text-[11px] text-[var(--text-muted)]">Repetitions per set</span>
            </div>
            <div class="flex items-center gap-1.5 shrink-0">
                <button type="button" @click="if (reps > 1) reps--" class="counter-btn">-</button>
                <input type="number" name="target_reps" x-model.number="reps" min="1" max="200"
                    class="input-gym !w-20 text-center font-semibold text-base !h-11 !py-1 !px-2">
                <button type="button" @click="if (reps < 200) reps++" class="counter-btn">+</button>
            </div>
        </div>

        <!-- Weight (kg) Row -->
        <div class="p-3.5 space-y-2.5">
            <div class="flex items-center justify-between gap-3">
                <div>
                    <label class="block text-xs font-semibold text-[var(--text-primary)]">Weight (kg)</label>
                    <span class="text-[11px] text-[var(--text-muted)]">Blank or 0 for bodyweight</span>
                </div>
                <div class="flex items-center gap-1.5 shrink-0">
                    <button type="button" @click="if (weight && weight >= 2.5) weight -= 2.5; else if(weight && weight > 0) weight = 0;" class="counter-btn">-</button>
                    <input type="number" name="target_weight_kg" x-model.number="weight" min="0" max="500" step="0.5"
                        placeholder="BW"
                        class="input-gym !w-20 text-center font-semibold text-base !h-11 !py-1 !px-2">
                    <button type="button" @click="weight = (weight ? weight + 2.5 : 2.5)" class="counter-btn">+</button>
                </div>
            </div>

            <!-- Quick Weight Presets -->
            <div class="flex items-center justify-between text-xs pt-0.5 tabular-nums">
                <span class="text-[11px] text-[var(--text-muted)]">Presets:</span>
                <div class="flex items-center gap-1.5 flex-wrap">
                    <button type="button" @click="weight = null"
                        :class="!weight ? 'badge-accent' : 'badge-neutral'"
                        class="px-2 py-0.5 rounded-md text-xs font-medium">
                        Bodyweight
                    </button>
                    <button type="button" @click="weight = 5" class="px-2 py-0.5 rounded-md badge-neutral text-xs">5kg</button>
                    <button type="button" @click="weight = 10" class="px-2 py-0.5 rounded-md badge-neutral text-xs">10kg</button>
                    <button type="button" @click="weight = 15" class="px-2 py-0.5 rounded-md badge-neutral text-xs">15kg</button>
                    <button type="button" @click="weight = 20" class="px-2 py-0.5 rounded-md badge-neutral text-xs">20kg</button>
                </div>
            </div>
        </div>

        <!-- Schedule on Days of the Week -->
        <div class="p-3.5 space-y-2">
            <div class="flex items-center justify-between">
                <label class="block text-xs font-semibold text-[var(--text-secondary)]">
                    Schedule on Days
                </label>
                <span class="text-[11px] font-medium text-accent">
                    {{ workout_exercise.scheduled_days_display }}
                </span>
            </div>
            <div class="grid grid-cols-7 gap-1">
                {% for day_val, day_name in day_choices %}
                <label class="cursor-pointer">
                    <input type="checkbox" name="days" value="{{ day_val }}"
                        {% if day_val in workout_exercise.scheduled_day_indices %}checked{% endif %}
                        class="sr-only peer">
                    <div class="h-11 rounded-xl border border-[var(--border-subtle)] bg-[var(--bg-surface-elevated)] flex flex-col items-center justify-center text-xs font-semibold text-[var(--text-secondary)] peer-checked:bg-[var(--accent-primary)] peer-checked:text-white peer-checked:border-[var(--accent-primary)] transition-colors">
                        <span>{{ day_name }}</span>
                    </div>
                </label>
                {% endfor %}
            </div>
        </div>

        <!-- Actions -->
        <div class="p-3.5 flex items-center justify-end gap-2 bg-[var(--bg-surface-elevated)]">
            <button type="button"
                hx-post="{% url 'workouts:workout_exercise_move' workout.id workout_exercise.id 'up' %}"
                hx-target="#workout-exercise-list"
                class="btn-gym btn-secondary-gym px-3 text-xs font-medium">
                Cancel
            </button>
            <button type="submit"
                class="btn-gym btn-primary-gym px-4 text-xs font-semibold">
                Save Changes
            </button>
        </div>
    </form>
</div>
